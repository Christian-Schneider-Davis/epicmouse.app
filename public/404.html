<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found (404) — Epic Mouse App</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');

  :root {
    --cream: #fbf6ef;
    --cream-soft: #fefbf6;
    --paper: #ffffff;
    --ink: #2f2a44;
    --ink-soft: #5b5570;
    --ink-faint: #8a84a0;

    --coral: #ff6f5e;
    --coral-dark: #e6543f;
    --coral-light: #ffe4df;

    --sage: #7fb69a;
    --sage-light: #e1f2e8;

    --blush: #ffd6e0;
    --butter: #ffdda1;

    --shadow-color: 262deg 40% 20%;
    --shadow-md: 0 8px 24px hsl(var(--shadow-color) / 0.12);
    --shadow-glow: 0 0 0 1px hsl(var(--shadow-color) / 0.04), 0 20px 60px hsl(var(--shadow-color) / 0.18);

    --font-display: "Baloo 2", "Segoe UI", ui-rounded, system-ui, sans-serif;
    --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  .bg { position: absolute; inset: 0; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; }
  .blob-a { width: 380px; height: 380px; top: -140px; left: -120px; background: var(--blush); }
  .blob-b { width: 340px; height: 340px; top: -80px; right: -140px; background: var(--sage-light); }
  .blob-c { width: 300px; height: 300px; bottom: -160px; left: 38%; background: var(--butter); opacity: 0.35; }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    text-align: center;
  }

  .icon-wrap {
    position: relative;
    width: 128px;
    height: 128px;
    margin: 0 auto 28px auto;
  }
  .icon-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed hsl(262deg 25% 82%);
    animation: spin 22s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .icon-ring { animation: none; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .icon-wrap img {
    position: absolute;
    inset: 10px;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: var(--shadow-md);
    padding: 14px;
    display: block;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--coral-light);
    color: var(--coral-dark);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    padding: 7px 16px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--coral-dark);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.7rem, 4.4vw, 2.3rem);
    line-height: 1.16;
    margin: 0 0 16px 0;
    letter-spacing: -0.01em;
  }

  p.sub {
    font-size: 1.02rem;
    color: var(--ink-soft);
    max-width: 420px;
    margin: 0 auto 30px auto;
  }

  .actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(230, 84, 63, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(230, 84, 63, 0.38);
  }

  .link-secondary {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink-soft);
    border-bottom: 1px solid hsl(262deg 25% 80%);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .link-secondary:hover {
    color: var(--coral-dark);
    border-color: var(--coral-dark);
  }

  .code {
    font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin-top: 40px;
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div class="card">
    <div class="icon-wrap">
      <span class="icon-ring" aria-hidden="true"></span>
      <img src="/apple-touch-icon.png" alt="Epic Mouse App" />
    </div>

    <span class="eyebrow"><span class="dot"></span>404 — PAGE NOT FOUND</span>

    <h1>This page wandered off the path.</h1>

    <p class="sub">
      We couldn't find what you were looking for — the link might be old, or the
      page may have moved. Let's get you back to familiar ground.
    </p>

    <div class="actions">
      <a class="btn-primary" href="/">Back to home</a>
      <a class="link-secondary" href="/app">Open the app →</a>
    </div>

    <p class="code">ERROR 404</p>
  </div>
</body>
</html>
